<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Email Workflow Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>

    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M11 2L13.5 8.5H20.5L14.75 12.75L17 19L11 15L5 19L7.25 12.75L1.5 8.5H8.5L11 2Z" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Email Copilot</h1>
          <p>Your inbox, intelligently distilled</p>
        </div>
      </div>
      <button id="refreshBtn" class="refresh-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </header>

    <main class="container">

      <section class="stats">
        <div class="stat stat-total">
          <div class="stat-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="stat-body">
            <div class="stat-value" id="emailCount">—</div>
            <div class="stat-label">Emails</div>
          </div>
        </div>
        <div class="stat stat-urgent">
          <div class="stat-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div class="stat-body">
            <div class="stat-value" id="highCount">—</div>
            <div class="stat-label">High urgency</div>
          </div>
        </div>
        <div class="stat stat-action">
          <div class="stat-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </div>
          <div class="stat-body">
            <div class="stat-value" id="actionCount">—</div>
            <div class="stat-label">Need action</div>
          </div>
        </div>
      </section>

      <div class="divider">
        <span>Latest emails</span>
      </div>

      <section class="list" id="emailList">
        <div class="skeleton-card"><div class="sk sk-line sk-w80"></div><div class="sk sk-line sk-w50 sk-mt"></div><div class="sk sk-block"></div></div>
        <div class="skeleton-card"><div class="sk sk-line sk-w60"></div><div class="sk sk-line sk-w40 sk-mt"></div><div class="sk sk-block"></div></div>
        <div class="skeleton-card"><div class="sk sk-line sk-w70"></div><div class="sk sk-line sk-w55 sk-mt"></div><div class="sk sk-block"></div></div>
      </section>

    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
